services:
  - type: web
    name: niat-decision-lab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      - key: NIAT_DB_PATH
        value: /tmp/niat.sqlite3
